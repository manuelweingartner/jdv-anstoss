<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#16131c">
<title>jdv Beste Vorschläge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238a2d3b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia' font-style='italic' font-size='20' fill='white'%3Ej%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #16131c;
    --ink-soft: #221d2b;
    --paper: #fffdf9;
    --paper-text: #191919;
    --paper-muted: #75707a;
    --vin: #8a2d3b;
    --vin-bright: #c4576a;
    --cloud: #b9b3c2;
    --line: rgba(255, 255, 255, .09);
    --wash-politisch: linear-gradient(135deg, #a9c3b2, #d9c9b8);
    --wash-persoenlich: linear-gradient(135deg, #d9b8bd, #c9c2dc);
    --wash-mitmach: linear-gradient(135deg, #b0c4d6, #cfd8b8);
    --wash-schnittmenge: linear-gradient(135deg, #d6c8a8, #c0b6d0);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--ink); }
  body {
    margin: 0; padding: 20px 14px 60px; background: var(--ink); color: var(--cloud);
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    max-width: 560px; margin-inline: auto; min-height: 100vh;
  }
  .masthead { text-align: center; margin: 10px 0 26px; }
  .eyebrow {
    font-size: .68rem; letter-spacing: .32em; text-transform: uppercase;
    color: var(--vin-bright); font-weight: 600;
  }
  h1 {
    font-family: Didot, "Bodoni MT", "Playfair Display", Georgia, serif;
    font-style: italic; font-weight: 500; font-size: 2.1rem;
    margin: 2px 0 6px; color: #f2eff6; letter-spacing: .01em;
  }
  .dateline { font-size: .82rem; color: var(--cloud); }

  .slot { padding: 14px; border-radius: 18px; margin-bottom: 18px; }
  .slot.politisch-aktuell { background: var(--wash-politisch); }
  .slot.persönlich       { background: var(--wash-persoenlich); }
  .slot.mitmach          { background: var(--wash-mitmach); }
  .slot.schnittmenge     { background: var(--wash-schnittmenge); }

  .post {
    background: var(--paper); color: var(--paper-text); border-radius: 12px;
    padding: 14px 16px 12px; box-shadow: 0 10px 24px rgba(0, 0, 0, .25);
  }
  .topline { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .starsline { color: #d9a400; font-size: 1.05rem; letter-spacing: .06em; }
  .starsline span { color: #ccc; }
  .age {
    margin-left: auto; font-size: .74rem; font-weight: 600; border-radius: 999px;
    padding: 3px 10px; background: #efece7; color: #6d6678;
  }
  .age.frisch { background: var(--vin); color: #fff; }
  .posttext { white-space: pre-wrap; font-size: 1.04rem; line-height: 1.45; margin: 0 0 10px; }
  .posttext .note { color: var(--paper-muted); font-size: .85rem; font-style: italic; }
  .kicker {
    font-size: .74rem; color: var(--paper-muted); border-top: 1px solid #eee;
    padding-top: 8px; letter-spacing: .02em;
  }
  .actions { margin-top: 10px; }
  .b-copy {
    appearance: none; border: none; border-radius: 999px; padding: 10px 18px;
    background: var(--ink); color: #fff; font-size: .92rem; font-weight: 600;
    cursor: pointer; width: 100%;
  }
  .b-copy:active { transform: scale(.98); }

  .empty {
    text-align: center; padding: 40px 10px; color: var(--cloud);
    font-family: Georgia, serif; font-style: italic; font-size: 1.15rem;
  }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #f2eff6; color: var(--ink); border-radius: 999px;
    padding: 10px 20px; font-size: .9rem; font-weight: 600;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .4); opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  footer { text-align: center; color: #6d6678; font-size: .78rem; margin-top: 28px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header class="masthead">
  <div class="eyebrow">jardinduvin</div>
  <h1>Beste Vorschläge</h1>
  <div class="dateline" id="dateline">Bewertet, nicht abgelehnt, Sterne zuerst.</div>
</header>

<main id="liste"><div class="empty">Lade Bewertungen …</div></main>

<footer><a href="index.html">← zurück zum Tages-Anstoss</a></footer>
<div class="toast" id="toast"></div>

<script>
const REPO = 'manuelweingartner/jdv-anstoss';
const LS_STATE = 'jdv_state';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyText(text) {
  const clean = text.replace(/\n?\(.*?\)\s*$/s, '').trim();
  const viaApi = navigator.clipboard
    ? Promise.race([
        navigator.clipboard.writeText(clean).then(() => true),
        new Promise(res => setTimeout(() => res(false), 1500)),
      ]).catch(() => false)
    : Promise.resolve(false);
  if (await viaApi) return true;
  try {
    const ta = document.createElement('textarea');
    ta.value = clean; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    return ok;
  } catch (e) { return false; }
}

function washClass(typ) {
  if (/pers/i.test(typ)) return 'persönlich';
  if (/mitmach/i.test(typ)) return 'mitmach';
  if (/schnitt/i.test(typ)) return 'schnittmenge';
  return 'politisch-aktuell';
}

/* Alle je generierten Ideen: Archiv + aktuelle Tagesliste */
async function loadIdeen() {
  const all = new Map();
  try {
    const a = await (await fetch(`data/archiv.json?t=${Date.now()}`)).json();
    (a.ideen || []).forEach(i => all.set(i.id, i));
  } catch (e) {}
  try {
    const d = await (await fetch(`data/ideen.json?t=${Date.now()}`)).json();
    (d.ideen || []).forEach(i => all.set(i.id, { ...i, datum: d.datum }));
  } catch (e) {}
  return all;
}

/* Bewertungen: öffentliche Issues (RATE/NEIN), neueste zuerst geliefert */
async function loadFeedback() {
  const rating = new Map(), rejected = new Set();
  for (let page = 1; page <= 5; page++) {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=100&page=${page}`,
      { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub-API ' + r.status);
    const items = await r.json();
    for (const it of items) {
      let m = it.title.match(/^RATE (\d)\/5: (\S+)/);
      if (m && !rating.has(m[2])) rating.set(m[2], +m[1]);
      m = it.title.match(/^NEIN: (\S+)/);
      if (m) rejected.add(m[1]);
    }
    if (items.length < 100) break;
  }
  return { rating, rejected };
}

function ageLabel(datum) {
  const days = Math.round((new Date().setHours(0,0,0,0) - new Date(datum).setHours(0,0,0,0)) / 86400000);
  if (days <= 0) return { text: 'heute', frisch: true };
  if (days === 1) return { text: 'gestern', frisch: false };
  return { text: `vor ${days} Tagen`, frisch: false };
}

function card(idee, sterne) {
  const slot = document.createElement('section');
  slot.className = `slot ${washClass(idee.typ)}`;
  const post = document.createElement('article');
  post.className = 'post';

  const noteSplit = idee.text.match(/^([\s\S]*?)(\n?\(.*\))?$/);
  const mainText = (noteSplit[1] || idee.text).trim();
  const note = (noteSplit[2] || '').trim();
  const age = ageLabel(idee.datum);
  const datumFmt = new Date(idee.datum).toLocaleDateString('de-CH',
    { day: 'numeric', month: 'long', year: 'numeric' });

  post.innerHTML = `
    <div class="topline">
      <div class="starsline">${'★'.repeat(sterne)}<span>${'★'.repeat(5 - sterne)}</span></div>
      <div class="age"></div>
    </div>
    <p class="posttext"></p>
    <div class="kicker"></div>
    <div class="actions"><button class="b-copy">Post kopieren</button></div>`;

  const ageEl = post.querySelector('.age');
  ageEl.textContent = age.text;
  if (age.frisch) ageEl.classList.add('frisch');

  const pt = post.querySelector('.posttext');
  pt.textContent = mainText;
  if (note) {
    const n = document.createElement('span');
    n.className = 'note'; n.textContent = '\n\n' + note;
    pt.appendChild(n);
  }
  post.querySelector('.kicker').textContent =
    `${idee.typ} · ${idee.stichwort} · ${datumFmt}`;

  post.querySelector('.b-copy').onclick = async () => {
    const ok = await copyText(idee.text);
    toast(ok ? 'Kopiert' : 'Kopieren blockiert, bitte manuell markieren');
  };

  slot.appendChild(post);
  return slot;
}

(async () => {
  const liste = document.getElementById('liste');
  try {
    const [ideen, fb] = await Promise.all([loadIdeen(), loadFeedback()]);

    /* Lokalen Stand desselben Geräts einmischen: deckt Wartendes ohne Token ab */
    const local = JSON.parse(localStorage.getItem(LS_STATE) || '{}');
    Object.entries(local).forEach(([id, st]) => {
      if (!st || typeof st !== 'object') return;
      if (st.r && !fb.rating.has(id)) fb.rating.set(id, st.r);
      if (st.v && /^Abgelehnt/.test(st.v)) fb.rejected.add(id);
    });

    const best = [...fb.rating.entries()]
      .filter(([id, r]) => r > 0 && !fb.rejected.has(id) && ideen.has(id))
      .map(([id, r]) => ({ idee: ideen.get(id), sterne: r }))
      .sort((a, b) => b.sterne - a.sterne || b.idee.datum.localeCompare(a.idee.datum));

    liste.textContent = '';
    if (!best.length) {
      liste.innerHTML = '<div class="empty">Noch nichts bewertet. Sterne vergeben auf dem Tages-Anstoss, dann sammelt sich hier das Beste.</div>';
      return;
    }
    document.getElementById('dateline').innerHTML =
      `<b>${best.length}</b> bewertete Vorschläge · Sterne zuerst, Alter am Post`;
    best.forEach(({ idee, sterne }) => liste.appendChild(card(idee, sterne)));
  } catch (e) {
    liste.innerHTML = `<div class="empty">Konnte die Bewertungen nicht laden (${e.message}). Später nochmal versuchen.</div>`;
  }
})();
</script>
</body>
</html>
