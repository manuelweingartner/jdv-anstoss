<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ebebe8">
<title>jdv Auszählung</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ebebe8'/%3E%3Crect x='4' y='7' width='24' height='2.5' fill='%2316181a'/%3E%3Crect x='4' y='14' width='24' height='2.5' fill='%2316181a'/%3E%3Crect x='4' y='21' width='14' height='2.5' fill='%23a41f1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Gleiche Redaktionsliste wie der Anstoss, nur nach Bewertung sortiert. */
  :root {
    --grund: #ebebe8;
    --tinte: #16181a;
    --matt: #6b6f73;
    --linie: rgba(0, 0, 0, .16);
    --nein: #a41f1a;
    --t-politisch: #2b5d8a;
    --t-schnittmenge: #8a6d1f;
    --t-persoenlich: #7a3f6d;
    --t-remix: #3f7a6a;
    --t-mitmach: #6b6f73;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--grund); }
  body {
    margin: 0 auto; padding: 0 13px 60px; max-width: 620px;
    background: var(--grund); color: var(--tinte);
    font: 400 15.5px/1.65 "IBM Plex Mono", ui-monospace, monospace;
  }
  .status {
    position: sticky; top: 0; z-index: 20; background: var(--grund);
    display: flex; align-items: center; gap: 8px;
    padding: 11px 0 9px; border-bottom: 1px solid var(--tinte);
    font-size: .74rem; letter-spacing: .04em; color: var(--matt);
  }
  .status b { color: var(--tinte); font-weight: 600; }
  .status a { margin-left: auto; color: var(--tinte); text-decoration: none; flex: 0 0 auto; }

  .slot { padding: 15px 0 16px; border-bottom: 1px solid var(--linie); }
  .slot.weg {
    max-height: 0; padding: 0; opacity: 0; overflow: hidden; border-width: 0;
    transition: max-height .26s ease, opacity .2s ease, padding .26s ease;
  }
  .kopf {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    font-size: .7rem; letter-spacing: .09em; text-transform: uppercase;
    color: var(--matt); margin-bottom: 9px;
  }
  .kopf i { width: 8px; height: 8px; display: block; background: var(--t-politisch); }
  .slot[data-typ*="persön"] .kopf i { background: var(--t-persoenlich); }
  .slot[data-typ*="schnitt"] .kopf i { background: var(--t-schnittmenge); }
  .slot[data-typ*="remix"] .kopf i { background: var(--t-remix); }
  .slot[data-typ*="mitmach"] .kopf i { background: var(--t-mitmach); }
  .kaestchen { display: inline-flex; gap: 3px; }
  .kaestchen i { width: 11px; height: 11px; border: 1px solid var(--tinte); background: transparent; }
  .kaestchen i.voll { background: var(--tinte); }
  .alter { margin-left: auto; color: var(--matt); }
  .alter.frisch { color: var(--tinte); font-weight: 600; }
  .warnung {
    display: block; margin: 0 0 9px; font-size: .7rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--nein);
  }
  .posttext { white-space: pre-wrap; margin: 0 0 10px; }
  .posttext .note { display: block; margin-top: 9px; color: var(--matt); font-size: .8rem; }
  .kicker { font-size: .68rem; line-height: 1.5; color: var(--matt); word-break: break-word; }

  .actions { display: flex; align-items: center; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  .actions button {
    appearance: none; border: 1px solid var(--tinte); border-radius: 0;
    background: transparent; color: var(--tinte); cursor: pointer;
    font: 500 .74rem/1 inherit; letter-spacing: .04em; padding: 9px 11px;
  }
  .actions .v-ja { background: var(--tinte); color: var(--grund); }
  .actions .v-nein { border-color: var(--nein); color: var(--nein); }
  .actions button:active { transform: translate(1px, 1px); }
  .reasons { display: none; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .slot.fragt .reasons { display: flex; }
  .slot.fragt .actions { display: none; }
  .reasons button {
    appearance: none; border: 1px dashed var(--nein); border-radius: 0;
    background: transparent; color: var(--nein); cursor: pointer;
    font: 400 .74rem/1 inherit; padding: 9px 10px;
  }
  .actions button:focus-visible, .reasons button:focus-visible {
    outline: 2px solid var(--nein); outline-offset: 2px;
  }
  .genommen {
    display: none; margin-top: 10px; font-size: .72rem; letter-spacing: .06em;
    text-transform: uppercase;
  }
  .genommen::before { content: "\2713  "; }
  .slot.done .genommen { display: block; }
  .slot.done .actions, .slot.done .reasons { display: none; }
  .slot.done .posttext, .slot.done .kicker { color: var(--matt); }

  .leer { padding: 26px 0; font-size: .8rem; color: var(--matt); }
  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: var(--tinte); color: var(--grund); padding: 10px 15px;
    font-size: .76rem; opacity: 0; pointer-events: none; transition: opacity .18s;
    max-width: 92vw; text-align: center; z-index: 30;
  }
  .toast.show { opacity: 1; }
  footer {
    margin-top: 22px; padding-top: 11px; border-top: 1px solid var(--tinte);
    font-size: .7rem; line-height: 1.6; color: var(--matt);
  }
  footer a { color: var(--tinte); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="status">
  <span id="stand">zählt</span>
  <a href="index.html">← Anstoss</a>
</div>

<main id="liste"><div class="leer">Bewertungen werden geladen …</div></main>

<footer>Genommenes und Abgelehntes fällt aus der Liste.</footer>
<div class="toast" id="toast"></div>

<script>
const REPO = 'manuelweingartner/jdv-anstoss';
const LS_STATE = 'jdv_state', LS_TOKEN = 'jdv_token', LS_QUEUE = 'jdv_queue';
const REASONS = ['zu erklärend', 'konstruiert', 'kein Widerspruch', 'Thema falsch', 'schon gemacht', 'einfach nicht lustig'];

const lokal = JSON.parse(localStorage.getItem(LS_STATE) || '{}');
const saveLokal = () => localStorage.setItem(LS_STATE, JSON.stringify(lokal));

/* Daten am Pages-Build vorbei laden, gleiche Begruendung wie in index.html:
   der Build hing am 06.08.2026 sieben Minuten und lieferte 17 Minuten nach dem
   Knopfdruck noch die alte Liste. SHA-gepinnte raw-URL ist pro Commit
   eindeutig und damit nie abgestanden; raw/main (max-age=300, Cache-Buster
   wirkungslos) und der Pages-Pfad bleiben als Rueckfall. */
let shaAus = false;
async function headShaSafe() {
  if (shaAus) return null;
  try {
    const tok = localStorage.getItem(LS_TOKEN);
    const h = { Accept: 'application/vnd.github+json' };
    if (tok) h.Authorization = `Bearer ${tok}`;
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=1`,
      { headers: h });
    if (!r.ok) throw new Error(`commits ${r.status}`);
    return (await r.json())[0].sha;
  } catch (e) {
    shaAus = true;
    return null;
  }
}

async function ladeDaten(name, sha) {
  const quellen = [];
  if (sha) quellen.push(`https://raw.githubusercontent.com/${REPO}/${sha}/data/${name}`);
  quellen.push(`https://raw.githubusercontent.com/${REPO}/main/data/${name}?t=${Date.now()}`);
  quellen.push(`data/${name}?t=${Date.now()}`);
  let letzter = new Error('keine Quelle');
  for (const u of quellen) {
    try {
      const r = await fetch(u);
      if (r.ok) return await r.json();
      letzter = new Error(`${r.status}`);
    } catch (e) {
      letzter = e;
    }
  }
  throw letzter;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1900);
}

async function copyText(text) {
  const clean = text.replace(/\n?\(.*?\)\s*$/s, '').trim();
  const viaApi = navigator.clipboard
    ? Promise.race([
        navigator.clipboard.writeText(clean).then(() => true),
        new Promise(res => setTimeout(() => res(false), 1500)),
      ]).catch(() => false)
    : Promise.resolve(false);
  if (await viaApi) return true;
  try {
    const ta = document.createElement('textarea');
    ta.value = clean; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* Gleiche Mechanik wie auf dem Anstoss: ohne Token wandert die Meldung in die
   localStorage-Queue und geht beim naechsten Besuch mit Token raus. */
async function sendIssue(title, body) {
  const token = localStorage.getItem(LS_TOKEN);
  const queue = JSON.parse(localStorage.getItem(LS_QUEUE) || '[]');
  if (!token) {
    queue.push({ title, body });
    localStorage.setItem(LS_QUEUE, JSON.stringify(queue));
    return 'queued';
  }
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
      body: JSON.stringify({ title, body }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return 'sent';
  } catch (e) {
    queue.push({ title, body });
    localStorage.setItem(LS_QUEUE, JSON.stringify(queue));
    return 'queued';
  }
}

async function loadIdeen() {
  const all = new Map();
  const sha = await headShaSafe();
  try {
    const a = await ladeDaten('archiv.json', sha);
    (a.ideen || []).forEach(i => all.set(i.id, i));
  } catch (e) {}
  try {
    const d = await ladeDaten('ideen.json', sha);
    (d.ideen || []).forEach(i => all.set(i.id, { ...i, datum: d.datum }));
  } catch (e) {}
  return all;
}

/* Bewertungen aus den oeffentlichen Issues, neueste zuerst geliefert */
async function loadFeedback() {
  const rating = new Map(), rejected = new Set(), genommen = new Set();
  for (let page = 1; page <= 5; page++) {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=100&page=${page}`,
      { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub-API ' + r.status);
    const items = await r.json();
    for (const it of items) {
      let m = it.title.match(/^RATE (\d)\/5: (\S+)/);
      if (m && !rating.has(m[2])) rating.set(m[2], +m[1]);
      m = it.title.match(/^NEIN: (\S+)/);
      if (m) rejected.add(m[1]);
      m = it.title.match(/^OK: (\S+)/);
      if (m) genommen.add(m[1]);
    }
    if (items.length < 100) break;
  }
  return { rating, rejected, genommen };
}

function alter(datum) {
  const tage = Math.round((new Date().setHours(0,0,0,0) - new Date(datum).setHours(0,0,0,0)) / 86400000);
  if (tage <= 0) return { text: 'heute', frisch: true, tage: 0 };
  if (tage === 1) return { text: 'gestern', frisch: false, tage: 1 };
  return { text: `vor ${tage} Tagen`, frisch: false, tage };
}

function zeile(idee, sterne) {
  const el = document.createElement('section');
  el.className = 'slot';
  el.dataset.typ = idee.typ || '';

  const split = idee.text.match(/^([\s\S]*?)(\n?\(.*\))?$/);
  const haupt = (split[1] || idee.text).trim();
  const note = (split[2] || '').trim();
  const a = alter(idee.datum);
  const datumFmt = new Date(idee.datum).toLocaleDateString('de-CH',
    { day: '2-digit', month: '2-digit', year: 'numeric' });

  el.innerHTML = `
    <div class="kopf">
      <span class="kaestchen"></span>
      <i></i><span>${[idee.typ, idee.schaerfe].filter(Boolean).join(' · ')}</span>
      <span class="alter"></span>
    </div>
    <p class="posttext"></p>
    <div class="kicker"></div>
    <div class="actions">
      <button class="v-kopie">kopieren</button>
      <button class="v-ja">nehme ich</button>
      <button class="v-nein">nein</button>
    </div>
    <div class="reasons"></div>
    <div class="genommen"></div>`;

  const k = el.querySelector('.kaestchen');
  for (let n = 1; n <= 5; n++) {
    const i = document.createElement('i');
    if (n <= sterne) i.className = 'voll';
    k.appendChild(i);
  }

  const alterEl = el.querySelector('.alter');
  alterEl.textContent = a.text;
  if (a.frisch) alterEl.classList.add('frisch');

  /* News-gebundene Ideen veralten: ab 3 Tagen warnen. Alte Eintraege ohne
     haltbarkeit-Feld gelten als tagesgebunden, ausser persoenlich/mitmach. */
  const halt = idee.haltbarkeit
    || (/pers|mitmach/i.test(idee.typ) ? 'evergreen' : 'tagesgebunden');
  if (halt === 'tagesgebunden' && a.tage >= 3) {
    const w = document.createElement('span');
    w.className = 'warnung';
    w.textContent = 'News-gebunden, vor dem Posten auf Aktualität prüfen';
    el.querySelector('.posttext').before(w);
  }

  const txt = el.querySelector('.posttext');
  txt.textContent = haupt;
  if (note) {
    const n = document.createElement('span');
    n.className = 'note'; n.textContent = note;
    txt.appendChild(n);
  }
  el.querySelector('.kicker').textContent =
    [idee.id, idee.stichwort, idee.plattform, datumFmt].filter(Boolean).join(' · ');

  el.querySelector('.v-kopie').onclick = async () => {
    const ok = await copyText(idee.text);
    toast(ok ? 'Kopiert' : 'Kopieren blockiert, Text bitte markieren');
  };

  el.querySelector('.v-ja').onclick = async () => {
    const zeit = new Date().toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    el.querySelector('.genommen').textContent = `genommen ${zeit}`;
    el.classList.add('done');
    const st = lokal[idee.id] = lokal[idee.id] || { v: null, r: sterne };
    st.v = 'Genommen und kopiert'; saveLokal();
    const ok = await copyText(idee.text);
    const res = await sendIssue(`OK: ${idee.id}`,
      `Stichwort: ${idee.stichwort}\nPlattform: ${idee.plattform}\nAus der Auszählung genommen.`);
    toast(ok
      ? (res === 'sent' ? 'Kopiert und gemeldet. Viel Erfolg!' : 'Kopiert. Meldung wartet auf Token.')
      : 'Markiert. Kopieren blockiert, Text bitte markieren.');
    zaehlen();
  };

  el.querySelector('.v-nein').onclick = () => el.classList.toggle('fragt');

  const reasons = el.querySelector('.reasons');
  REASONS.forEach(grund => {
    const b = document.createElement('button');
    b.textContent = grund;
    b.onclick = async () => {
      const st = lokal[idee.id] = lokal[idee.id] || { v: null, r: sterne };
      st.v = `Abgelehnt: ${grund}`; saveLokal();
      el.classList.add('weg');
      setTimeout(() => { el.remove(); zaehlen(); }, 280);
      const res = await sendIssue(`NEIN: ${idee.id}`,
        `Stichwort: ${idee.stichwort}\nGrund: ${grund}\nAus der Auszählung abgelehnt.`);
      toast(res === 'sent' ? 'Abgelehnt, gesendet' : 'Abgelehnt, wird später gesendet');
    };
    reasons.appendChild(b);
  });

  return el;
}

function zaehlen() {
  const alle = [...document.querySelectorAll('#liste .slot')];
  const offen = alle.filter(s => !s.classList.contains('done')).length;
  document.getElementById('stand').innerHTML = `<b>${offen}</b> offen`;
  if (!alle.length) {
    document.getElementById('liste').innerHTML =
      '<div class="leer">Abgeräumt. Neue Bewertungen entstehen auf dem Anstoss.</div>';
  }
}

(async () => {
  const liste = document.getElementById('liste');
  try {
    const [ideen, fb] = await Promise.all([loadIdeen(), loadFeedback()]);

    /* Lokalen Stand desselben Geraets einmischen: deckt Wartendes ohne Token ab */
    Object.entries(lokal).forEach(([id, st]) => {
      if (!st || typeof st !== 'object') return;
      if (st.r && !fb.rating.has(id)) fb.rating.set(id, st.r);
      if (st.v && /^Abgelehnt/.test(st.v)) fb.rejected.add(id);
      if (st.v && /^Genommen/.test(st.v)) fb.genommen.add(id);
    });

    const best = [...fb.rating.entries()]
      .filter(([id, r]) => r > 0 && !fb.rejected.has(id) && !fb.genommen.has(id) && ideen.has(id))
      .map(([id, r]) => ({ idee: ideen.get(id), sterne: r }))
      .sort((a, b) => b.sterne - a.sterne || b.idee.datum.localeCompare(a.idee.datum));

    liste.textContent = '';
    if (!best.length) {
      liste.innerHTML = '<div class="leer">Noch nichts bewertet. Bewertung vergibst du auf dem Anstoss, hier sammelt sich das Beste.</div>';
      document.getElementById('stand').textContent = '0 offen';
      return;
    }
    best.forEach(({ idee, sterne }) => liste.appendChild(zeile(idee, sterne)));
    zaehlen();
  } catch (e) {
    liste.innerHTML = `<div class="leer">Bewertungen nicht geladen (${e.message}). Seite neu laden.</div>`;
  }
})();
</script>
</body>
</html>
